services:
  - type: web
    name: heychat-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: MONGODB_URI
        value: "<YOUR_MONGODB_URI>"
      - key: JWT_SECRET
        value: "<YOUR_JWT_SECRET>"
      - key: NODE_ENV
        value: "production"
      - key: FRONTEND_URL
        value: "https://<YOUR_RENDER_FRONTEND_URL>"
      - key: CLOUDINARY_CLOUD_NAME
        value: "<YOUR_CLOUDINARY_NAME>"
      - key: CLOUDINARY_API_KEY
        value: "<YOUR_CLOUDINARY_KEY>"
      - key: CLOUDINARY_API_SECRET
        value: "<YOUR_CLOUDINARY_SECRET>"
      - key: PORT
        value: "10000"
  - type: web
    name: heychat-frontend
    env: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VITE_API_URL
        value: "https://<YOUR_RENDER_BACKEND_URL>/api/"
      - key: VITE_SOCKET_URL
        value: "https://<YOUR_RENDER_BACKEND_URL>"
